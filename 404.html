<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>페이지를 찾을 수 없습니다 — Farmhannong Agro Weekly</title>
<style>
  :root { --green:#15663f; --ink:#1b271f; --paper:#fcfaf3; --ivory:#f3efe4; --hair:#e4ddcc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
    background-color: var(--ivory); color: var(--ink); padding: 24px;
  }
  .box {
    width: 100%; max-width: 430px; background: var(--paper);
    border: 1px solid var(--hair); border-radius: 18px;
    box-shadow: 0 18px 48px rgba(27,39,31,0.10); padding: 46px 38px 38px; text-align: center;
  }
  .sprout { width: 44px; height: 54px; display: block; margin: 0 auto 14px; }
  .sprout path { fill: none; stroke: var(--green); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 1.3em; color: var(--green); line-height: 1.3; }
  p { margin-top: 14px; font-size: 0.9em; color: #5f7167; line-height: 1.7; }
  a.home {
    display: inline-block; margin-top: 24px; padding: 12px 26px; border-radius: 11px;
    background: var(--green); color: #fff; font-weight: 700; font-size: 0.92em; text-decoration: none;
  }
  a.home:hover { background: #2f9e44; }
  a.home:focus-visible { outline: 3px solid rgba(33,134,83,0.35); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="box">
    <svg class="sprout" viewBox="0 0 48 60" aria-hidden="true">
      <path d="M24 56 L24 27"/>
      <path d="M24 32 C 11 32 5 23 6 12 C 19 13 24 22 24 32"/>
      <path d="M24 27 C 37 27 43 18 42 7 C 29 8 24 17 24 27"/>
    </svg>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청하신 주소가 없거나 이동되었습니다.<br>주소를 다시 확인하시거나 첫 화면으로 돌아가주세요.</p>
    <a class="home" href="/">첫 화면으로</a>
  </div>
</body>
</html>
